<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAC-TIACompleter</title>

  <!-- marked.js for markdown rendering (CDN, prototype only) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>

  <!-- ══════════════════════════════════════════════════════════════════
       FONT / WINDOW SIZE  —  直接修改下面这一行即可
       可选值: 1.3 = 大  |  1.0 = 中  |  0.88 = 小
       窗口尺寸会随缩放比例自动调整
  ═══════════════════════════════════════════════════════════════════ -->
  <script>
    window.MAC_ZOOM = 1.3;
    document.documentElement.style.setProperty('--zoom', window.MAC_ZOOM);
  </script>

  <style>
    /* ── font-size zoom ───────────────────────────────────────────────── */
    :root { --zoom: 1.3; }   /* overwritten immediately by inline script */

    /* ── design tokens ─────────────────────────────────────────────────── */
    :root {
      --bg:            #0d0d14;
      --surface:       #13131d;
      --surface2:      #1a1a27;
      --border:        #252538;
      --border2:       #1e1e30;
      --primary:       #7c3aed;
      --primary-glow:  #7c3aed66;
      --accent:        #6366f1;
      --text:          #dde1f0;
      --text-muted:    #6b7280;
      --text-dim:      #94a3b8;
      --user-bg:       linear-gradient(135deg, #2e1f66, #1a1640);
      --agent-bg:      #141420;
      --tool-bg:       #0f0f18;
      --success:       #10b981;
      --danger:        #ef4444;
      --warning:       #f59e0b;
      --scrollbar:     #252540;
      --radius-sm:     6px;
      --radius-md:     10px;
      --radius-lg:     14px;
    }

    /* ── reset ─────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    a { color: #818cf8; }

    /* ── body / layout ─────────────────────────────────────────────────── */
    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
    }

    #app {
      display: flex;
      flex-direction: column;
      /* zoom + compensated height so the bottom input row is never clipped */
      zoom: var(--zoom, 1);
      height: calc(100vh / var(--zoom, 1));
      max-height: calc(100vh / var(--zoom, 1));
    }

    /* ── header ────────────────────────────────────────────────────────── */
    #header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
      user-select: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand-icon {
      width: 22px; height: 22px;
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      box-shadow: 0 0 8px var(--primary-glow);
    }

    .brand-name {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      background: linear-gradient(90deg, #a78bfa, #818cf8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      -webkit-app-region: no-drag;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 8px;
    }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #374151;
      transition: background 0.3s, box-shadow 0.3s;
      flex-shrink: 0;
    }
    .status-dot.ready     { background: var(--success); box-shadow: 0 0 5px #10b98199; }
    .status-dot.thinking  { background: #a78bfa; animation: pulse-dot 1.1s ease-in-out infinite; }
    .status-dot.error     { background: var(--danger); }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.7); }
    }

    .btn-clear {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 10px;
      padding: 3px 8px;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-clear:hover { border-color: #4b5563; color: var(--text-dim); }

    /* ── messages ──────────────────────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 10px 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #messages::-webkit-scrollbar         { width: 4px; }
    #messages::-webkit-scrollbar-track   { background: transparent; }
    #messages::-webkit-scrollbar-thumb   { background: var(--scrollbar); border-radius: 2px; }

    /* ── user bubble ───────────────────────────────────────────────────── */
    .user-msg {
      align-self: flex-end;
      max-width: 85%;
      background: var(--user-bg);
      border: 1px solid #3730a344;
      border-radius: var(--radius-lg) var(--radius-lg) 3px var(--radius-lg);
      padding: 8px 12px;
      line-height: 1.55;
      word-break: break-word;
      animation: slide-from-right 0.22s ease;
    }

    /* ── processing block (wraps thinking + tool cards) ────────────────── */
    .processing-block {
      align-self: flex-start;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* ── thinking indicator ────────────────────────────────────────────── */
    .thinking-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      align-self: flex-start;
      font-size: 11px;
      color: var(--text-muted);
      animation: fade-in 0.2s ease;
    }

    .thinking-dots {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .thinking-dots span {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #a78bfa;
      animation: dot-wave 1.3s ease-in-out infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.30s; }

    @keyframes dot-wave {
      0%, 60%, 100% { transform: translateY(0);    opacity: 0.4; }
      30%            { transform: translateY(-4px); opacity: 1;   }
    }

    /* ── tool step card ────────────────────────────────────────────────── */
    .step-card {
      background: var(--tool-bg);
      border: 1px solid var(--border2);
      border-radius: var(--radius-md);
      overflow: hidden;
      animation: card-flip-in 0.28s ease;
    }

    @keyframes card-flip-in {
      0%   { opacity: 0; transform: perspective(600px) rotateX(-12deg) translateY(8px); }
      100% { opacity: 1; transform: perspective(600px) rotateX(0deg)   translateY(0);   }
    }

    .step-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      cursor: pointer;
      user-select: none;
      background: #111119;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .step-header:hover { background: #161624; }

    .step-icon {
      font-size: 12px;
      flex-shrink: 0;
      opacity: 0.85;
    }

    .step-name {
      flex: 1;
      font-size: 11.5px;
      font-weight: 500;
      color: #a5b4fc;
      font-family: "Cascadia Code", "Fira Code", "Consolas", monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .step-status {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .mini-spinner {
      width: 11px; height: 11px;
      border: 1.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── step card body (collapsible) ──────────────────────────────────── */
    .step-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                  padding    0.2s ease;
    }
    .step-body.open {
      max-height: 240px;
      padding: 8px 10px;
      border-top: 1px solid var(--border2);
    }
    .step-body-inner { display: flex; flex-direction: column; gap: 5px; }

    .step-label {
      font-size: 9px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .step-code {
      font-family: "Cascadia Code", "Fira Code", "Consolas", monospace;
      font-size: 10.5px;
      background: #0a0a12;
      border: 1px solid #1a1a2a;
      border-radius: 4px;
      padding: 5px 7px;
      color: #94a3b8;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
      max-height: 80px;
    }

    .step-result {
      font-family: "Cascadia Code", "Fira Code", "Consolas", monospace;
      font-size: 10.5px;
      padding: 5px 7px;
      border-radius: 4px;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
      max-height: 80px;
      animation: fade-in 0.2s ease;
    }
    .step-result.ok    { color: #6ee7b7; background: #052e16; border: 1px solid #064e3b; }
    .step-result.fail  { color: #fca5a5; background: #2c0000; border: 1px solid #7f1d1d; }

    /* ── intermediate llm text ─────────────────────────────────────────── */
    .llm-text {
      align-self: flex-start;
      max-width: 90%;
      background: #131320;
      border: 1px solid var(--border2);
      border-radius: var(--radius-md);
      padding: 6px 10px;
      font-size: 12px;
      color: var(--text-dim);
      font-style: italic;
      animation: slide-from-left 0.2s ease;
    }

    /* ── final agent response ──────────────────────────────────────────── */
    .agent-msg {
      align-self: flex-start;
      max-width: 93%;
      background: var(--agent-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 3px;
      padding: 10px 13px;
      line-height: 1.65;
      animation: slide-from-left 0.26s ease;
      /* Make agent text selectable */
      user-select: text;
      -webkit-user-select: text;
    }

    .agent-label {
      font-size: 9px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: #818cf8;
      font-weight: 700;
      margin-bottom: 6px;
    }

    /* markdown inside agent-msg – always selectable */
    .agent-content {
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
    }
    .agent-content p              { margin-bottom: 6px; }
    .agent-content p:last-child   { margin-bottom: 0; }
    .agent-content code {
      background: #0d1117;
      border-radius: 3px;
      padding: 1px 4px;
      font-family: "Cascadia Code", "Fira Code", "Consolas", monospace;
      font-size: 11px;
      color: #c084fc;
    }
    .agent-content pre {
      background: #0d1117;
      border: 1px solid #1e293b;
      border-radius: var(--radius-sm);
      padding: 8px;
      margin: 6px 0;
      overflow-x: auto;
    }
    .agent-content pre code { background: none; padding: 0; color: var(--text); font-size: 11px; }
    .agent-content ul,
    .agent-content ol     { padding-left: 16px; margin: 4px 0; }
    .agent-content li     { margin: 2px 0; }
    .agent-content h1, .agent-content h2, .agent-content h3 {
      margin: 8px 0 4px;
      color: #a78bfa;
    }
    .agent-content strong { color: #e2e8f0; }
    .agent-content blockquote {
      border-left: 3px solid var(--primary);
      padding-left: 8px;
      color: var(--text-dim);
      margin: 4px 0;
    }
    .agent-content table  { border-collapse: collapse; width: 100%; margin: 6px 0; }
    .agent-content th,
    .agent-content td     { border: 1px solid var(--border); padding: 4px 8px; font-size: 11px; }
    .agent-content th     { background: var(--surface2); color: #a78bfa; }

    /* ── error message ─────────────────────────────────────────────────── */
    .error-msg {
      align-self: center;
      background: #1c0000;
      border: 1px solid #7f1d1d;
      border-radius: var(--radius-md);
      padding: 6px 12px;
      font-size: 11.5px;
      color: #fca5a5;
      animation: fade-in 0.2s ease;
    }

    /* ── system notice ─────────────────────────────────────────────────── */
    .notice {
      align-self: center;
      font-size: 10.5px;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
      animation: fade-in 0.2s ease;
    }

    /* ── animations ────────────────────────────────────────────────────── */
    @keyframes slide-from-right {
      from { opacity: 0; transform: translateX(14px); }
      to   { opacity: 1; transform: translateX(0);    }
    }
    @keyframes slide-from-left {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0);     }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── input area ────────────────────────────────────────────────────── */
    #input-area {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 10px 11px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    #user-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      font-family: inherit;
      font-size: 12.5px;
      line-height: 1.55;
      padding: 7px 10px;
      resize: none;
      outline: none;
      overflow-y: auto;
      max-height: 90px;
      transition: border-color 0.2s;
    }
    #user-input:focus       { border-color: var(--primary); }
    #user-input::placeholder { color: #374151; }

    #send-btn {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      border-radius: var(--radius-md);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      height: 34px;
      padding: 0 14px;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 2px 8px var(--primary-glow);
    }
    #send-btn:hover:not(:disabled)  { opacity: 0.88; transform: translateY(-1px); }
    #send-btn:active:not(:disabled) { transform: translateY(0); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; transform: none; }

    /* ── init overlay ──────────────────────────────────────────────────── */
    #init-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    #init-overlay.hidden { display: none; }

    .init-logo {
      width: 54px; height: 54px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      box-shadow: 0 0 24px var(--primary-glow);
    }

    .init-title {
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #818cf8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .init-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── copy button ────────────────────────────────────────────────────── */
    .copy-wrap {
      position: relative;
    }
    .copy-btn {
      position: absolute;
      top: 3px;
      right: 3px;
      background: rgba(10, 10, 18, 0.92);
      border: 1px solid #252540;
      border-radius: 3px;
      color: #4b5563;
      cursor: pointer;
      font-size: 9px;
      padding: 1px 5px;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
      line-height: 1.5;
      z-index: 2;
      white-space: nowrap;
    }
    .copy-wrap:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { color: #a5b4fc; border-color: #4b5563; }
    .copy-btn.copied { color: var(--success); border-color: var(--success); opacity: 1; }

    /* agent-msg copy button (absolute in top-right corner) */
    .agent-msg { position: relative; }
    .agent-msg > .copy-btn { top: 8px; right: 10px; }
    .agent-msg:hover > .copy-btn { opacity: 1; }

    .init-spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
  </style>
</head>

<body>
<!-- ── init overlay ─────────────────────────────────────────────────────── -->
<div id="init-overlay">
  <div class="init-logo">⚡</div>
  <div class="init-title">MAC-TIACompleter</div>
  <div class="init-row">
    <div class="init-spinner"></div>
    <span id="init-msg">正在连接 Agent...</span>
  </div>
</div>

<!-- ── app shell ─────────────────────────────────────────────────────────── -->
<div id="app">
  <div id="header">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <span class="brand-name">MAC-TIACompleter</span>
    </div>
    <div class="header-actions">
      <div class="status-pill">
        <div id="status-dot" class="status-dot"></div>
        <span id="status-txt">连接中</span>
      </div>
      <button class="btn-clear" id="btn-clear" title="清空对话">新对话</button>
    </div>
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <textarea
      id="user-input"
      placeholder="输入提示词，Enter 发送 · Shift+Enter 换行"
      rows="1"
      disabled
    ></textarea>
    <button id="send-btn" disabled>发送</button>
  </div>
</div>

<script>
/* ── config ─────────────────────────────────────────────────────────────── */
const PORT = window.BACKEND_PORT || 17788;
const WS_URL = `ws://127.0.0.1:${PORT}/ws`;

/* ── marked options ─────────────────────────────────────────────────────── */
if (typeof marked !== 'undefined') {
  marked.setOptions({ breaks: true, gfm: true });
}
function renderMd(text) {
  if (typeof marked !== 'undefined') return marked.parse(text || '');
  // fallback: plain text with newlines
  return (text || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                     .replace(/\n/g,'<br>');
}

/* ── DOM refs ───────────────────────────────────────────────────────────── */
const msgBox     = document.getElementById('messages');
const inputEl    = document.getElementById('user-input');
const sendBtn    = document.getElementById('send-btn');
const statusDot  = document.getElementById('status-dot');
const statusTxt  = document.getElementById('status-txt');
const overlay    = document.getElementById('init-overlay');
const initMsg    = document.getElementById('init-msg');
const btnClear   = document.getElementById('btn-clear');

/* ── window resize to match zoom ───────────────────────────────────────── */
// Base window dimensions (must match main_gui.py webview.create_window)
const BASE_W = 440, BASE_H = 700;
const _zoom  = window.MAC_ZOOM || 1.3;
window.resizeTo(Math.round(BASE_W * _zoom), Math.round(BASE_H * _zoom));

/* ── state ──────────────────────────────────────────────────────────────── */
let ws            = null;
let busy          = false;
let curBlock      = null;   // current .processing-block element
let stepCards     = {};     // tool_call_id → .step-card element

/* ── helpers ────────────────────────────────────────────────────────────── */
function scrollBottom() {
  msgBox.scrollTop = msgBox.scrollHeight;
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function setStatus(state, label) {
  statusDot.className = `status-dot ${state}`;
  statusTxt.textContent = label;
}

function setBusy(on) {
  busy = on;
  sendBtn.disabled = on;
  inputEl.disabled = on;
  if (!on) { setStatus('ready', 'Agent 就绪'); inputEl.focus(); }
  else       setStatus('thinking', '处理中…');
}
/* ── copy helpers ──────────────────────────────────────────────────────── */
function _copyText(text) {
  if (navigator.clipboard) return navigator.clipboard.writeText(text);
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select(); document.execCommand('copy');
  document.body.removeChild(ta); return Promise.resolve();
}
function makeCopyBtn(getText) {
  const btn = document.createElement('button');
  btn.className = 'copy-btn'; btn.title = '复制'; btn.textContent = '复制';
  btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    try {
      await _copyText(getText());
      btn.textContent = '✓'; btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
    } catch { /* ignore */ }
  });
  return btn;
}
function wrapWithCopy(el, getText) {
  const wrap = document.createElement('div');
  wrap.className = 'copy-wrap';
  el.parentNode.insertBefore(wrap, el);
  wrap.appendChild(el); wrap.appendChild(makeCopyBtn(getText));
}
/* ── message builders ───────────────────────────────────────────────────── */
function appendUserMsg(text) {
  const el = document.createElement('div');
  el.className = 'user-msg';
  el.textContent = text;
  msgBox.appendChild(el);
  scrollBottom();
}

function appendNotice(text) {
  const el = document.createElement('div');
  el.className = 'notice';
  el.textContent = text;
  msgBox.appendChild(el);
  scrollBottom();
}

function appendErrorMsg(text) {
  const el = document.createElement('div');
  el.className = 'error-msg';
  el.textContent = '⚠ ' + text;
  msgBox.appendChild(el);
  scrollBottom();
}

/* ensure a processing-block exists for the current turn */
function ensureBlock() {
  if (!curBlock) {
    curBlock = document.createElement('div');
    curBlock.className = 'processing-block';
    msgBox.appendChild(curBlock);
  }
}

/* ── event handlers ─────────────────────────────────────────────────────── */
function onThinking() {
  ensureBlock();
  // Add thinking row only if none exists yet
  if (!curBlock.querySelector('.thinking-row')) {
    const row = document.createElement('div');
    row.className = 'thinking-row';
    row.innerHTML = `
      <div class="thinking-dots">
        <span></span><span></span><span></span>
      </div>
      Agent 正在思考…`;
    curBlock.appendChild(row);
    scrollBottom();
  }
}

function onLlmText(content) {
  ensureBlock();
  const el = document.createElement('div');
  el.className = 'llm-text';
  el.textContent = content;
  curBlock.appendChild(el);
  scrollBottom();
}

function onToolCall(evt) {
  ensureBlock();

  const argsStr = (typeof evt.args === 'object')
    ? JSON.stringify(evt.args, null, 2)
    : String(evt.args || '');

  const card = document.createElement('div');
  card.className = 'step-card';
  card.innerHTML = `
    <div class="step-header">
      <span class="step-icon">⚙</span>
      <span class="step-name">${esc(evt.name)}</span>
      <div class="step-status">
        <div class="mini-spinner"></div>
        <span class="step-status-txt">执行中</span>
      </div>
    </div>
    <div class="step-body open">
      <div class="step-body-inner">
        <div class="step-label">参数</div>
        <div class="step-code">${esc(argsStr)}</div>
      </div>
    </div>`;

  card.querySelector('.step-header').addEventListener('click', () => {
    card.querySelector('.step-body').classList.toggle('open');
  });

  // 参数复制按钮
  wrapWithCopy(card.querySelector('.step-code'), () => argsStr);

  curBlock.appendChild(card);
  stepCards[evt.id] = card;
  scrollBottom();
}

function onToolResult(evt) {
  const card = stepCards[evt.id];
  if (!card) return;

  const isErr = typeof evt.content === 'string' && evt.content.startsWith('Error');

  // Update status badge
  const statusEl = card.querySelector('.step-status');
  statusEl.innerHTML = isErr
    ? `<span style="color:var(--danger)">✗ 失败</span>`
    : `<span style="color:var(--success)">✓ 完成</span>`;

  // Append result to body
  const inner = card.querySelector('.step-body-inner');
  const lbl   = document.createElement('div');
  lbl.className = 'step-label';
  lbl.style.marginTop = '4px';
  lbl.textContent = '返回值';

  const res = document.createElement('div');
  res.className = `step-result ${isErr ? 'fail' : 'ok'}`;
  const raw = String(evt.content || '');
  res.textContent = raw.length > 500 ? raw.slice(0, 500) + ' …' : raw;

  inner.appendChild(lbl);
  inner.appendChild(res);

  // 返回值复制按钮
  wrapWithCopy(res, () => raw);

  // Expand max-height to fit (bump it)
  const body = card.querySelector('.step-body');
  if (body.classList.contains('open')) {
    body.style.maxHeight = (body.scrollHeight + 100) + 'px';
    // After animation, reset to CSS-driven value
    setTimeout(() => { body.style.maxHeight = ''; }, 350);
  }
  scrollBottom();
}

function onFinal(content) {
  // Remove the live thinking row (keep tool cards)
  if (curBlock) {
    const tr = curBlock.querySelector('.thinking-row');
    if (tr) tr.remove();
    // Collapse all tool bodies
    curBlock.querySelectorAll('.step-body.open').forEach(b => b.classList.remove('open'));
  }
  curBlock   = null;
  stepCards  = {};

  const bubble = document.createElement('div');
  bubble.className = 'agent-msg';
  bubble.innerHTML = `
    <div class="agent-label">AGENT</div>
    <div class="agent-content">${renderMd(content)}</div>`;

  // 最终回答复制按钮（复制原始文本，不含 markdown 标记）
  bubble.appendChild(makeCopyBtn(() => content));

  msgBox.appendChild(bubble);

  setBusy(false);
  scrollBottom();
}

/* ── WebSocket ──────────────────────────────────────────────────────────── */
function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    // wait for "ready" event from server before enabling UI
  };

  ws.onmessage = (e) => {
    let evt;
    try { evt = JSON.parse(e.data); } catch { return; }

    switch (evt.type) {
      case 'ready':
        overlay.classList.add('hidden');
        setStatus('ready', 'Agent 就绪');
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
        break;

      // ── permanent init failure ───────────────────────────────────────────
      case 'init_error': {
        const spinner = overlay.querySelector('.init-spinner');
        if (spinner) spinner.style.display = 'none';
        initMsg.style.color = '#fca5a5';
        // Show only first line so the overlay stays readable; full trace is in
        // the terminal where the server is running.
        const firstLine = (evt.message || '未知错误').split('\n')[0];
        initMsg.textContent = '初始化失败: ' + firstLine;
        // Add a sub-hint
        const hint = document.createElement('div');
        hint.style.cssText = 'font-size:10px;color:#6b7280;margin-top:6px;max-width:320px;text-align:center;';
        hint.textContent = '请查看终端输出获取详细信息，修复后重启应用';
        overlay.appendChild(hint);
        // Don't reconnect – server WS stays open
        break;
      }

      case 'thinking':    onThinking();           break;
      case 'llm_text':    onLlmText(evt.content); break;
      case 'tool_call':   onToolCall(evt);         break;
      case 'tool_result': onToolResult(evt);       break;
      case 'final':       onFinal(evt.content);    break;

      case 'cleared':
        msgBox.innerHTML = '';
        appendNotice('对话已清空');
        break;

      case 'error':
        appendErrorMsg(evt.message || '未知错误');
        if (busy) setBusy(false);
        curBlock  = null;
        stepCards = {};
        break;
    }
  };

  ws.onerror = () => {
    initMsg.textContent = '连接失败，正在重试…';
  };

  ws.onclose = () => {
    // If the overlay already shows a fatal init error, don't reconnect –
    // it would wipe the error message and confuse the user.
    const overlayVisible = !overlay.classList.contains('hidden');
    const isFatalError   = overlayVisible && initMsg.style.color === 'rgb(252, 165, 165)';

    if (isFatalError) return;   // stay on error screen

    if (overlayVisible) {
      initMsg.textContent = '重新连接中…';
    } else {
      setStatus('error', '连接断开');
    }
    if (busy) { setBusy(false); }
    curBlock  = null;
    stepCards = {};
    setTimeout(connect, 2000);
  };
}

/* ── send ───────────────────────────────────────────────────────────────── */
function send() {
  const text = inputEl.value.trim();
  if (!text || busy || !ws || ws.readyState !== WebSocket.OPEN) return;

  appendUserMsg(text);
  inputEl.value = '';
  inputEl.style.height = 'auto';
  setBusy(true);

  // Reset per-query state
  curBlock  = null;
  stepCards = {};

  ws.send(JSON.stringify({ type: 'query', content: text }));
}

/* ── clear ──────────────────────────────────────────────────────────────── */
btnClear.addEventListener('click', () => {
  if (busy) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'clear' }));
  } else {
    msgBox.innerHTML = '';
    appendNotice('对话已清空');
  }
});

/* ── input behaviour ────────────────────────────────────────────────────── */
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 90) + 'px';
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

sendBtn.addEventListener('click', send);

/* ── start ──────────────────────────────────────────────────────────────── */
connect();
</script>
</body>
</html>
